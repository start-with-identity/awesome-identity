name: Build

on:
  push:
    branches: [main]
    paths:
      - data/**
      - templates/**
      - scripts/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run validate
      - run: npm run build

      - name: Commit generated files
        run: |
          if git diff --quiet -- README.md VENDORS.md LEARNING-PATHS.md; then
            echo "Nothing to update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md VENDORS.md LEARNING-PATHS.md
          git commit -m "Regenerate generated pages"
          git push
