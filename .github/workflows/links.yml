name: Links

on:
  pull_request:
    paths:
      - data/**
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect added URLs
        run: |
          git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" -- data/ \
            | grep -E '^\+' | grep -oE 'https://[^ "]+' | sort -u > urls.txt || true
          echo "Checking $(wc -l < urls.txt) URL(s)"

      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml urls.txt
          fail: true

  all:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --cache --max-cache-age 1d "data/**/*.yml"
          output: lychee/report.md
          fail: false

      - name: Open an issue for broken links
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken links report
          content-filepath: lychee/report.md
          labels: dead-link
