- name: "Web Authentication: An API for accessing Public Key Credentials, Level 3"
  url: https://www.w3.org/TR/webauthn-3/
  description: Browser API behind passkeys, covering navigator.credentials.create and get, attestation formats, and how relying parties verify assertions.
