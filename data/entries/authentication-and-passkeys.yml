- name: "RFC 4226: HOTP: An HMAC-Based One-Time Password Algorithm"
  url: https://datatracker.ietf.org/doc/html/rfc4226
  description: Counter-based one-time password algorithm with HMAC-SHA-1 and dynamic truncation, the base that TOTP builds on.
  tags: [standard]
  added: 2026-11-10
  verified: 2026-11-10

- name: "RFC 6238: TOTP: Time-Based One-Time Password Algorithm"
  url: https://datatracker.ietf.org/doc/html/rfc6238
  description: Replaces the HOTP counter with a time step, usually 30 seconds, and is what authenticator apps generate.
  tags: [standard]
  added: 2026-11-10
  verified: 2026-11-10

- name: "RFC 2865: Remote Authentication Dial In User Service (RADIUS)"
  url: https://datatracker.ietf.org/doc/html/rfc2865
  description: AAA protocol still used for VPN, Wi-Fi, and network device logins; its MD5-based integrity is weak, so run it inside TLS or IPsec.
  tags: [standard]
  added: 2026-11-10
  verified: 2026-11-10

