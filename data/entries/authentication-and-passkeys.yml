- name: Client to Authenticator Protocol (CTAP) 2.3
  url: https://fidoalliance.org/specs/fido-v2.3-ps-20260226/fido-client-to-authenticator-protocol-v2.3-ps-20260226.html
  description: How a platform talks to a roaming authenticator over USB, NFC, or BLE, and the hybrid transport for using a phone as a passkey.
  tags: [standard]
  added: 2026-11-10
