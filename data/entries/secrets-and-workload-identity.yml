- name: OpenBao
  url: https://openbao.org/
  repo: https://github.com/openbao/openbao
  description: Linux Foundation fork of HashiCorp Vault that stays under MPL-2.0, created after Vault moved to the Business Source License.
  tags: [oss]
  added: 2026-11-10
  verified: 2026-11-10

- name: SPIFFE
  url: https://spiffe.io/
  repo: https://github.com/spiffe/spiffe
  description: Workload identity specifications defining SPIFFE IDs, X.509 and JWT SVIDs, trust bundles, and the Workload API; a CNCF graduated project.
  tags: [oss]
  added: 2026-11-10
  verified: 2026-11-10

- name: SPIRE
  url: https://spiffe.io/docs/latest/spire-about/
  repo: https://github.com/spiffe/spire
  description: Reference SPIFFE runtime that attests nodes and workloads, then issues short-lived X.509 and JWT SVIDs through the Workload API.
  tags: [oss]
  added: 2026-11-10
  verified: 2026-11-10

- name: SPIKE
  url: https://spike.ist/
  repo: https://github.com/spiffe/spike
  description: Lightweight secrets store from the SPIFFE community that authenticates clients by SPIFFE ID and spreads root key shards across keepers.
  tags: [oss]
  added: 2026-11-10
  verified: 2026-11-10

- name: cert-manager
  url: https://cert-manager.io/
  repo: https://github.com/cert-manager/cert-manager
  description: Kubernetes controller that requests and renews X.509 certificates from ACME, Vault, private CAs, and other issuers declared as resources.
  tags: [oss]
  added: 2026-11-10
  verified: 2026-11-10

- name: trust-manager
  url: https://cert-manager.io/docs/trust/trust-manager/
  repo: https://github.com/cert-manager/trust-manager
  description: Companion operator from the cert-manager project that distributes CA trust bundles across namespaces as ConfigMaps or Secrets.
  tags: [oss]
  added: 2026-11-10
  verified: 2026-11-10

- name: step-ca
  url: https://smallstep.com/docs/step-ca/
  repo: https://github.com/smallstep/certificates
  description: Online private CA from Smallstep that issues X.509 and SSH certificates through ACME, OIDC, cloud instance identity, and JWK provisioners.
  tags: [oss]
  added: 2026-11-10
  verified: 2026-11-10

- name: EJBCA Community
  url: https://www.ejbca.org/
  repo: https://github.com/Keyfactor/ejbca-ce
  description: Java certificate authority from Keyfactor with ACME, SCEP, EST, and CMP enrollment; the community edition is published under LGPL-2.1.
  tags: [oss]
  added: 2026-11-10
  verified: 2026-11-10

- name: Infisical
  url: https://github.com/Infisical/infisical
  description: Secrets manager with a web dashboard, CLI, Kubernetes operator, and dynamic secrets; code is MIT except ee directories under a commercial license.
  tags: [oss]
  added: 2026-11-10
  verified: 2026-11-10

- name: SOPS
  url: https://getsops.io/
  repo: https://github.com/getsops/sops
  description: Encrypts values inside YAML, JSON, ENV, and INI files with age, PGP, or cloud KMS keys so secrets can be committed to Git.
  tags: [oss]
  added: 2026-11-10
  verified: 2026-11-10

- name: External Secrets Operator
  url: https://external-secrets.io/
  repo: https://github.com/external-secrets/external-secrets
  description: Kubernetes operator that syncs values from AWS Secrets Manager, Azure Key Vault, Vault, and other stores into native Secrets.
  tags: [oss]
  added: 2026-11-10
  verified: 2026-11-10

- name: Sealed Secrets
  url: https://github.com/bitnami/sealed-secrets
  description: Kubernetes controller and kubeseal CLI that encrypt Secrets with a cluster-held key so the ciphertext is safe to keep in Git.
  tags: [oss]
  added: 2026-11-10
  verified: 2026-11-10

- name: Conjur Open Source
  url: https://github.com/cyberark/conjur
  description: CyberArk secrets manager with policy-as-code and machine authenticators for Kubernetes, cloud IAM, and JWT, released under LGPL-3.0.
  tags: [oss]
  added: 2026-11-10
  verified: 2026-11-10

- name: Bank-Vaults
  url: https://bank-vaults.dev/
  repo: https://github.com/bank-vaults/bank-vaults
  description: Kubernetes operator, mutating webhook, and CLI for running Vault clusters declaratively and injecting their secrets into pods.
  tags: [oss]
  added: 2026-11-10
  verified: 2026-11-10
