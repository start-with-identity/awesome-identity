- name: Verifiable Credentials Data Model v2.0
  url: https://www.w3.org/TR/vc-data-model-2.0/
  description: W3C Recommendation for the issuer, holder, and verifier model, with the JSON-LD structure of credentials and presentations.
  tags: [standard]
  added: 2026-11-10
  verified: 2026-11-10

- name: Securing Verifiable Credentials using JOSE and COSE
  url: https://www.w3.org/TR/vc-jose-cose/
  description: Signs W3C credentials as JWS, SD-JWT, or COSE envelopes, an alternative to embedded Data Integrity proofs.
  tags: [standard]
  added: 2026-11-10
  verified: 2026-11-10

- name: Verifiable Credential Data Integrity 1.0
  url: https://www.w3.org/TR/vc-data-integrity/
  description: Embedded proof format for credentials, with canonicalization and cryptosuite rules that let a signature travel inside the JSON-LD document.
  tags: [standard]
  added: 2026-11-10
  verified: 2026-11-10

- name: Bitstring Status List v1.0
  url: https://www.w3.org/TR/vc-bitstring-status-list/
  description: Privacy-preserving revocation and suspension for W3C credentials, where each credential points at one bit in a compressed published list.
  tags: [standard]
  added: 2026-11-10
  verified: 2026-11-10

- name: Decentralized Identifiers (DIDs) v1.0
  url: https://www.w3.org/TR/did-1.0/
  description: URI scheme and DID document format for identifiers whose keys are resolved through a method such as did:web or did:key.
  tags: [standard]
  added: 2026-11-10
  verified: 2026-11-10

- name: Digital Credentials API (draft)
  url: https://www.w3.org/TR/digital-credentials/
  description: Browser API that lets a website request a credential from a wallet on the device, carrying OpenID4VP or ISO mdoc requests.
  tags: [standard]
  added: 2026-11-10
  verified: 2026-11-10

- name: OpenID for Verifiable Credential Issuance 1.0
  url: https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0-final.html
  description: OAuth-based API for issuing credentials into a wallet, with credential offers, pre-authorized codes, and proof of key possession.
  tags: [standard]
  added: 2026-11-10
  verified: 2026-11-10

- name: OpenID for Verifiable Presentations 1.0
  url: https://openid.net/specs/openid-4-verifiable-presentations-1_0-final.html
  description: Protocol a verifier uses to request credentials from a wallet, with the DCQL query language and same-device and cross-device flows.
  tags: [standard]
  added: 2026-11-10
  verified: 2026-11-10

- name: OpenID4VC High Assurance Interoperability Profile 1.0
  url: https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0-final.html
  description: HAIP narrows OpenID4VCI and OpenID4VP options for SD-JWT VC and mdoc credentials to a set that high-assurance wallets can share.
  tags: [standard]
  added: 2026-11-10
  verified: 2026-11-10

- name: SD-JWT-based Verifiable Digital Credentials (SD-JWT VC) (draft)
  url: https://datatracker.ietf.org/doc/draft-ietf-oauth-sd-jwt-vc/
  description: IETF credential format built on SD-JWT, adding the vct type claim, issuer key discovery, and type metadata.
  tags: [standard]
  added: 2026-11-10
  verified: 2026-11-10

- name: "ISO/IEC 18013-5:2021 Mobile driving licence (mDL) application"
  url: https://www.iso.org/standard/69084.html
  description: In-person presentation of a mobile driving licence over NFC, BLE, or Wi-Fi Aware, using the CBOR mdoc data model.
  tags: [standard, paid]
  added: 2026-11-10
  verified: 2026-11-10

- name: "ISO/IEC TS 18013-7:2025 Mobile driving licence (mDL) add-on functions"
  url: https://www.iso.org/standard/91154.html
  description: Extends 18013-5 to online presentation, adding retrieval over the web and through the browser Digital Credentials API.
  tags: [standard, paid]
  added: 2026-11-10
  verified: 2026-11-10

- name: EUDI Wallet Architecture and Reference Framework
  url: https://github.com/eu-digital-identity-wallet/eudi-doc-architecture-and-reference-framework
  description: European Commission repository for the ARF, which sets the roles, credential formats, and protocols for EU Digital Identity Wallets.
  tags: [gov, free]
  added: 2026-11-10
  verified: 2026-11-10
